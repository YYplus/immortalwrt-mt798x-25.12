name: Auto ImmortalWrt 25.12 for RAX3000M

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Restore and save source/ccache caches'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Check upstream updates
        id: check
        run: |
          UPSTREAM_COMMIT=$(git ls-remote --heads https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git 25.12 | awk '{print $1}')
          echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          
          if [ -f .last_sync_commit ]; then
            LAST_COMMIT=$(cat .last_sync_commit)
          else
            LAST_COMMIT=""
          fi
          
          if [ "$LAST_COMMIT" = "$UPSTREAM_COMMIT" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "need_build=false" >> $GITHUB_OUTPUT
          else
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no update
        if: steps.check.outputs.need_build == 'false'
        run: |
          echo "上游无更新，跳过编译"
          exit 0

      - name: Clone upstream source
        if: steps.check.outputs.need_build == 'true'
        run: |
          git clone https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt -b 25.12

      - name: Restore source download cache
        if: steps.check.outputs.need_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_cache)
        id: dl_cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-rax3000m-25.12-dl-v1-${{ hashFiles('feeds.conf.default', 'defconfig/rax3000m-openclash.config') }}-${{ steps.check.outputs.upstream_commit }}
          restore-keys: |
            ${{ runner.os }}-rax3000m-25.12-dl-v1-

      - name: Restore compiler cache
        if: steps.check.outputs.need_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_cache)
        id: cc_cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-rax3000m-25.12-ccache-v1-${{ hashFiles('defconfig/rax3000m-openclash.config') }}-${{ steps.check.outputs.upstream_commit }}
          restore-keys: |
            ${{ runner.os }}-rax3000m-25.12-ccache-v1-

      - name: Prepare sources and download dependencies
        if: steps.check.outputs.need_build == 'true'
        run: |
          cd openwrt
          mkdir -p dl .ccache

          # Use the fork's feed list while keeping OpenClash out of runtime APK repositories.
          cp ../feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Pin Vantage to a released version.
          git clone --depth 1 --branch v1.0.15 https://github.com/anothaDev/luci-theme-vantage.git package/vantage

          cp ../defconfig/rax3000m-openclash.config .config
          mkdir -p files/etc/uci-defaults
          install -m 0755 ../files/etc/uci-defaults/zzzz-vantage-theme files/etc/uci-defaults/zzzz-vantage-theme

          make defconfig
          grep -q '^CONFIG_CCACHE=y$' .config || { echo 'OpenWrt ccache is not enabled'; exit 1; }
          make download -j"$(nproc)"
          du -sh dl .ccache || true
          df -h .

      - name: Save source download cache
        if: steps.check.outputs.need_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_cache) && steps.dl_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: ${{ steps.dl_cache.outputs.cache-primary-key }}

      - name: Build firmware
        if: steps.check.outputs.need_build == 'true'
        env:
          CCACHE_MAXSIZE: 1G
        run: |
          cd openwrt
          make -j"$(nproc)"

          # Report cache usage; never fail a successful build for missing stats.
          if [ -x staging_dir/host/bin/ccache ]; then
            staging_dir/host/bin/ccache --show-stats || true
          elif command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          fi
          du -sh .ccache dl || true
          df -h .

          # Do not upload the binary package repository.
          rm -rf bin/targets/mediatek/filogic/packages

      - name: Save compiler cache
        if: steps.check.outputs.need_build == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_cache) && steps.cc_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ${{ steps.cc_cache.outputs.cache-primary-key }}

      - name: Update sync record
        if: steps.check.outputs.need_build == 'true'
        run: |
          echo "${{ steps.check.outputs.upstream_commit }}" > .last_sync_commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_sync_commit
          git commit -m "Update sync record" || true
          git push || true

      - name: Upload firmware
        if: steps.check.outputs.need_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: warn

      - name: Create Release and Upload Assets
        if: steps.check.outputs.need_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "RAX3000M 固件 ${{ steps.date.outputs.date }} #${{ github.run_number }}"
          tag_name: "build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          body: |
            ## 自动编译固件
            
            - 编译时间：${{ steps.date.outputs.date }}
            - 编译编号：#${{ github.run_number }}
            - 设备：CMCC RAX3000M (eMMC / NAND)
            - 内核：6.12（25.12 版本）
            - 包含插件：OpenClash、磁盘管理、Argon 主题等
            - 上游：chasey-dev/immortalwrt-mt798x-rebase
          files: openwrt/bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
